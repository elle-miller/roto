# Loss and optimizer settings for PD-gain identification.
#
# The `loss` section is used by src/loss.py (Step 3). The `search` section is
# used by src/collect_rollouts.py (candidate sampling) and src/optimize.py
# (selection over the collected results) -- see DECISIONS.md for why this
# project uses an offline collect-then-select design instead of a live
# optimizer-drives-the-simulator loop (a reproducible multi-minute Isaac Sim
# stall makes a tight feedback loop impractical on this machine).

loss:
  # Weight on the velocity-error term relative to the position-error term
  # (both are MSE, in rad^2 and (rad/s)^2 respectively -- NOT unit-matched,
  # so this weight is doing double duty as a unit-scaling factor too, not
  # just an importance weight). Kept low (0.1) because: (1) matching position
  # over time already implicitly constrains velocity shape quite a bit, so
  # this is a refinement, not a co-equal objective; (2) velocity is a finite
  # difference of position, which amplifies whatever noise survived
  # load_data.py's filtering -- a high weight here would let differentiation
  # noise, not real dynamics mismatch, dominate the optimization landscape.
  velocity_weight: 0.1

  # Every trajectory in this project starts with a jump away from the
  # settled zero pose (see src/loss.py docstring for why this is universal,
  # not an edge case) -- down-weight that transient instead of letting it
  # dominate the loss for what is, physically, the least interesting part of
  # the recording. 30 samples @ 60 Hz = 0.5s, chosen as roughly 2-3x a
  # typical PD settling time for these joints' rated speeds; revisit once
  # real hardware settling times are actually observed.
  warmup_samples: 30
  warmup_weight: 0.1

  # If a candidate's gains make the sim go unstable (NaN/Inf position), the
  # loss returned is this large-but-finite number rather than NaN itself --
  # NaN would break most optimizers' comparison logic (e.g. CMA-ES ranking
  # candidates), whereas a large finite number just makes that candidate
  # look very bad, which is the correct behavior.
  unstable_penalty: 1000000.0

search:
  # Per-joint free parameters are {Kp, Kd, Fc} -- NOT Fv, see DECISIONS.md
  # (viscous friction folds into Kd; not separately identifiable from
  # position-only motion data).
  #
  # Bounds are centered on the asset's current placeholder gains (Kp=1.0,
  # Kd=0.1 -- see roto/roto/assets/shadow_hand_lite.py's ImplicitActuatorCfg),
  # not on any real-hardware measurement, since no least-squares starting
  # guess or real hand data exists yet in this project. Widen/re-center once
  # real data and a proper starting guess exist.
  bounds:
    kp: {min: 0.1, max: 20.0}   # N*m/rad. Below 0.1: too soft to hold a
                                 # position against its own actuator effort
                                 # (implausible). Above 20: far stiffer than
                                 # any of these small finger actuators
                                 # (effort limits ~0.9-2.4 N*m, see
                                 # config/joints.yaml-adjacent joint table)
                                 # would need, and very high Kp is exactly
                                 # what makes the PhysX solver go unstable
                                 # (see loss.py's unstable_penalty).
    kd: {min: 0.001, max: 2.0}   # N*m*s/rad. Spans underdamped (near 0) to
                                 # heavily overdamped, centered near the
                                 # placeholder 0.1.
    fc: {min: 0.0, max: 0.5}     # N*m (Coulomb/dynamic friction torque).
                                 # Ceiling is roughly half the smallest
                                 # joint's effort limit (~0.9 N*m) -- a
                                 # friction torque above that would stall the
                                 # joint under its own actuator, which is not
                                 # physically plausible for a hand that moves.

  # Latin Hypercube sampling (via scipy.stats.qmc), not plain uniform random:
  # LHS guarantees every 1D projection of the parameter space is evenly
  # covered even with a modest sample count, which plain random sampling can
  # by chance leave gappy -- important here because each sample is expensive
  # (a full Isaac Sim rollout), so we can't just brute-force a huge N to
  # compensate for uneven coverage.
  n_candidates: 40
  sampling_seed: 0

