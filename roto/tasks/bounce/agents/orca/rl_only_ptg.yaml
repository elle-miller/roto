# Shadow Bounce config: rl_only_pt
observations:
  obs_list:
  - prop
  - tactile
  - gt
  obs_stack: 1
  tactile_cfg:
    binary_tactile: true
    binary_threshold: 0.01

agent:
  rollouts: 16
  learning_epochs: 4
  mini_batches: 8
  discount_factor: 0.99
  lambda: 0.95
  learning_rate: 3.21e-05
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  entropy_loss_scale: 0
  value_loss_scale: 1.0
  kl_threshold: 0

experiment:
  experiment_name: orca_bounce_rl_only_ptg
  wandb: 1
  wandb_kwargs:
    group: orca_bounce_rl_only_ptg
    name: PGT - tendons
