# Shadow Baoding config: rl_only_pt
# Shadow Bounce config: rl_only_pt
observations:
  obs_list:
  - prop
  - tactile
  - gt
  obs_stack: 4
  tactile_cfg:
    binary_tactile: true
    binary_threshold: 0.01

agent:
  rollouts: 32
  learning_epochs: 8
  mini_batches: 4
  discount_factor: 0.99
  lambda: 0.95
  learning_rate: 2.02e-04
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  value_loss_scale: 1.0
  entropy_loss_scale: 0.05
  kl_threshold: 0
  learning_rate_scheduler: "KLAdaptiveLR"
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.008
    min_lr: 1e-6
    max_lr: 1e-2
    kl_factor: 2
    lr_factor: 1.5
    apply_to_all: true

experiment:
  experiment_name: rl_only_pt
  wandb: 0
  wandb_kwargs:
    group: rl_only_pt
    name: '1'
