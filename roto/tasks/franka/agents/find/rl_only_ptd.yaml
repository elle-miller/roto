# Franka Find config: rl_only_ptg
observations:
  obs_list:
  - prop
  - tactile
  - pixels
  obs_stack: 3
  tactile_cfg:
    binary_tactile: true
    binary_threshold: 0.0
  pixel_cfg:
    types: 
    - depth
    width: 80
    height: 80
    latent_pixel_dim: 128
    normalise_rgb: false

agent:
  rollouts: 16
  learning_epochs: 8
  mini_batches: 8
  discount_factor: 0.99
  lambda: 0.95
  value_clip: 0.2
  ratio_clip: 0.2
  kl_threshold: 0
  learning_rate: 1.0e-05
  entropy_loss_scale: 0
  value_loss_scale: 1.0
  grad_norm_clip: 1.0

experiment:
  experiment_name: rl_only_ptd
  save_checkpoints: 1
  tb_log: 1
  wandb: 1
  wandb_kwargs:
    group: rl_only_ptd
    name: '1'

trainer:
  num_eval_envs: 20
  max_global_timesteps_M: 400