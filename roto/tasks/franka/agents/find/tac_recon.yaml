# Franka Find config: tac_recon

agent:
  rollouts: 64
  learning_epochs: 8
  mini_batches: 16
  discount_factor: 0.99
  lambda: 0.95
  value_clip: 0.2
  ratio_clip: 0.2
  kl_threshold: 0
  learning_rate: 1.36e-05
  entropy_loss_scale: 0.1
  value_loss_scale: 1.0
  grad_norm_clip: 1.0

ssl_task:
  type: reconstruction
  tactile_only: true
  n_rollouts: 1
  loss_weight: 0.004477
  learning_rate: 2.55e-05
  learning_epochs_ratio: 1

experiment:
  experiment_name: tac_recon
  tb_log: 1
  save_checkpoints: 1
  wandb: 1
  wandb_kwargs:
    group: tac_recon
    name: '1'
