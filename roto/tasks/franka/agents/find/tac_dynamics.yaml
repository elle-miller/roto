# Franka Find config: tac_dynamics

agent:
  rollouts: 64
  learning_epochs: 4
  mini_batches: 64
  discount_factor: 0.99
  lambda: 0.95
  value_clip: 0.2
  ratio_clip: 0.2
  kl_threshold: 0
  learning_rate: 2.32e-05
  entropy_loss_scale: 0
  value_loss_scale: 1.0
  grad_norm_clip: 1.0

ssl_task:
  type: forward_dynamics
  n_rollouts: 1
  tactile_only: true
  loss_weight: 0.0024563
  learning_rate: 1.57e-04
  seq_length: 5

experiment:
  experiment_name: tactile_dynamics
  save_checkpoints: 1
  tb_log: true
  wandb: 1
  wandb_kwargs:
    group: tactile_dynamics
    name: test
